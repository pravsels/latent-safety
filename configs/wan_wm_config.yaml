# Default configuration for training the WAN-backbone World Model.
# Usage:
#   python dino_wm/train_wan_wm.py --config configs/wan_wm_config.yaml

# Data
hdf5_file: arx5_datasets_6Feb_26_wan.h5
dataset_stats: arx5_datasets_6Feb_26_stats.json
test_frac: 0.1
action_key: actions_delta
front_latent_key: wan_front_embd
wrist_latent_key: wan_wrist_embd

# Training
batch_size: 16
train_iters: 100000
device: "cuda:0"
seed: 42
sequence_length: 4
# Time-step in raw dataset frames. pred_step=5 means train/eval on t->t+5.
pred_step: 5
# Number of future raw-frame actions to condition on.
action_horizon: 100
future_action_steps_train: 100
eval_horizon: 16
context_length: 3
eval_interval: 1000
eval_samples: 8
save_every: 1000

# Resume behavior
auto_resume: true

# WAN VAE options (input_size, latent grid dims defined in dino_wm/config.py WAN_CONFIG)
wan_vae_model: ByteDance/Video-As-Prompt-Wan2.1-14B
wan_vae_subfolder: vae
wan_vae_dtype: bf16

# WandB
wandb_mode: offline
wandb_project: wan-WM-action-horizon
wandb_entity: pravsels
wandb_name: wan-wm-action-horizon-first-run

# Optimizer / LR scheduling
lr_schedule: cosine
lr_min_factor: 0.1
lr_warmup_iters: 1000
