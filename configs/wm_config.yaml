# Default configuration for training the DINO World Model.
# Usage:
#   python dino_wm/train_dino_wm.py --config configs/wm_config.yaml

# Data
hdf5_file: arx5_datasets_6Feb_26.h5
dataset_stats: arx5_datasets_6Feb_26_stats.json
test_frac: 0.1
action_key: actions_delta

# Training
batch_size: 32
train_iters: 100000
device: "cuda:0"
seed: 42
sequence_length: 4
# Time-step in raw dataset frames. pred_step=5 means train/eval on t->t+5.
pred_step: 5
# Number of future raw-frame actions to condition on.
action_horizon: 100
future_action_steps_train: 100
eval_horizon: 16
context_length: 3
eval_interval: 1000
eval_samples: 8
save_every: 1000

# World Model / Decoder
dino_version: "v3"
dino_assets:
  decoder_checkpoint_dir: /scratch/u6cr/pravsels.u6cr/latent_safety/dino3_decoder_checkpoints
  wm_checkpoint_dir: /scratch/u6cr/pravsels.u6cr/latent_safety/dino3_wm_checkpoints

# Resume behavior
auto_resume: true

# WandB
wandb_mode: offline
wandb_project: dino-WM-action-horizon
wandb_entity: pravsels
wandb_name: dinov3-wm-action-horizon-first-run

# Optimizer / LR scheduling
lr_schedule: cosine
lr_min_factor: 0.1
lr_warmup_iters: 1000
